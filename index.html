<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI証券</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; }
        #chat-container { width: 100%; max-width: 600px; height: 100vh; height: 100dvh; background: white; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #header { background: #007bff; color: white; padding: 10px 12px; display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0; }
        
        #media-section { background: #111; padding: 10px; flex-shrink: 0; }
        #media-input-wrapper { display: flex; gap: 5px; margin-bottom: 10px; }
        #media-url-input { flex: 1; padding: 8px; border-radius: 4px; border: none; font-size: 0.9rem; background: #222; color: #fff; outline: none; }
        #media-share-btn { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        #media-container { display: flex; flex-direction: column; transition: all 0.3s; }
        #media-menu { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 5px 10px; }
        .media-tabs { display: flex; gap: 5px; }
        .media-tab-btn { background: #007bff; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; }
        #media-screen { width: 100%; height: 200px; background: #000; position: relative; }
        #youtube-player { width: 100%; height: 100%; border: none; }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background: #fff; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; position: relative; margin-bottom: 5px; }
        .my-messages { align-self: flex-end; align-items: flex-end; }
        .other-messages { align-self: flex-start; align-items: flex-start; }
        .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
        .my-messages .message-row { flex-direction: row-reverse; }

        .message { padding: 10px 14px; border-radius: 18px; background: #e4e6eb; font-size: 0.9rem; word-break: break-all; white-space: pre-wrap; cursor: pointer; transition: transform 0.1s; position: relative; user-select: none; }
        .my-messages .message { background: #007bff; color: white; }
        .message img { max-width: 100%; max-height: 200px; border-radius: 12px; display: block; cursor: pointer; }
        
        .reaction-badge-container { display: flex; gap: 3px; position: absolute; bottom: -12px; background: white; padding: 2px 6px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); border: 1px solid #eee; font-size: 0.75rem; cursor: pointer; z-index: 2; pointer-events: auto; color: #333; }
        .my-messages .reaction-badge-container { right: 10px; }
        .other-messages .reaction-badge-container { left: 10px; }

        .reaction-popup { display: none; position: absolute; background: white; border-radius: 30px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); gap: 8px; z-index: 999; border: 1px solid #ddd; flex-wrap: wrap; width: 220px; justify-content: center; }
        .reaction-emoji-btn { font-size: 1.3rem; border: none; background: none; cursor: pointer; padding: 4px; transition: transform 0.1s; }
        .reaction-emoji-btn:hover { transform: scale(1.25); }

        .msg-delete-link { font-size: 0.7rem; color: #aaa; text-decoration: none; cursor: pointer; visibility: hidden; margin: 0 4px; padding-bottom: 2px; }
        .message-wrapper:hover .msg-delete-link { visibility: visible; }
        
        #input-container { display: flex; padding: 10px; border-top: 1px solid #ddd; gap: 8px; background: white; flex-shrink: 0; align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        #message-input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 0.95rem; }
        #send-btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .action-btn { background: #f0f2f5; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }

        /* 画像プレビューモーダル */
        #image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        #image-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <button id="clear-all-btn" style="background:#dc3545; color:white; border:none; border-radius:4px; padding: 5px 10px; cursor:pointer; font-size:0.85rem;">全削除</button>
    </div>

    <div id="media-section">
        <div id="media-input-wrapper">
            <input type="text" id="media-url-input" placeholder="YouTubeのURLを入力">
            <button id="media-share-btn">動画を流す</button>
        </div>
        <div id="media-container">
            <div id="media-menu"><div class="media-tabs"><button class="media-tab-btn active">YouTube (同期中)</button></div></div>
            <div id="media-screen"><div id="youtube-player"></div></div>
        </div>
    </div>

    <div id="messages"></div>

    <div id="global-reaction-popup" class="reaction-popup">
        <button class="reaction-emoji-btn" data-emoji="👍">👍</button>
        <button class="reaction-emoji-btn" data-emoji="❤️">❤️</button>
        <button class="reaction-emoji-btn" data-emoji="😗">😗</button>
        <button class="reaction-emoji-btn" data-emoji="😮">😮</button>
        <button class="reaction-emoji-btn" data-emoji="👉">👉</button>
        <button class="reaction-emoji-btn" data-emoji="🙏">🙏</button>
        <button class="reaction-emoji-btn" data-emoji="🥺">🥺</button>
        <button class="reaction-emoji-btn" data-emoji="🌿">🌿</button>
    </div>

    <div id="input-container">
        <button class="action-btn" onclick="document.getElementById('file-input').click()" title="画像送信">➕</button>
        <button class="action-btn" onclick="document.getElementById('camera-input').click()" title="カメラ撮影">📷</button>
        <input type="file" id="file-input" accept="image/*" style="display:none">
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
        <input type="text" id="message-input" placeholder="メッセージを入力...">
        <button id="send-btn">送信</button>
    </div>
</div>

<!-- 画像拡大モーダル -->
<div id="image-modal" onclick="this.style.display='none'">
    <img id="modal-img" src="">
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    window.player = null; 
    window.currentVideoId = "JFf3uASYM4E"; 
    window.onYouTubeIframeAPIReady = function() {
        window.player = new YT.Player('youtube-player', {
            height: '100%', width: '100%', videoId: window.currentVideoId,
            playerVars: { 'autoplay': 1, 'controls': 1 },
            events: { 
                'onReady': () => { if(window.loadInitialVideo) window.loadInitialVideo(); },
                'onStateChange': (e) => { if(window.onPlayerStateChangeCallback) window.onPlayerStateChangeCallback(e); } 
            }
        });
    };
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, getDocs, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDkCdoQOuL9Kh0T0P9CCJPL39WMkT5t-nw",
        authDomain: "project-2987921418155591586.firebaseapp.com",
        projectId: "project-2987921418155591586",
        storageBucket: "project-2987921418155591586.firebasestorage.app",
        messagingSenderId: "34152717352",
        appId: "1:34152717352:web:244bc26dbcf8dec5b7691d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const myId = Math.random().toString(36).substring(2, 9);
    let isUpdatingFromFirebase = false;
    let activeMessageId = null;

    window.loadInitialVideo = async () => {
        const snap = await getDoc(doc(db, "shared_media_v4", "current"));
        if (snap.exists()) {
            const data = snap.data();
            window.currentVideoId = data.videoId;
            window.player.loadVideoById({ videoId: data.videoId, startSeconds: data.currentTime });
        }
    };

    window.onPlayerStateChangeCallback = function(event) {
        if (isUpdatingFromFirebase) return;
        syncToFirebase((event.data === YT.PlayerState.PLAYING) ? "playing" : "paused", window.player.getCurrentTime());
    };

    async function syncToFirebase(state, time) {
        if (isUpdatingFromFirebase) return;
        try { await setDoc(doc(db, "shared_media_v4", "current"), { videoId: window.currentVideoId, state, currentTime: time, updatedBy: myId, timestamp: Date.now() }); } catch (e) {}
    }

    setInterval(() => {
        if (window.player?.getPlayerState?.() === YT.PlayerState.PLAYING && !isUpdatingFromFirebase) syncToFirebase("playing", window.player.getCurrentTime());
    }, 2000);

    onSnapshot(doc(db, "shared_media_v4", "current"), (docSnap) => {
        if (!docSnap.exists() || !window.player) return;
        const data = docSnap.data();
        if (data.updatedBy === myId) return;
        isUpdatingFromFirebase = true;
        if (data.videoId !== window.currentVideoId) { window.currentVideoId = data.videoId; window.player.loadVideoById({ videoId: data.videoId, startSeconds: data.currentTime }); }
        else {
            if (Math.abs(window.player.getCurrentTime() - data.currentTime) > 3.0) window.player.seekTo(data.currentTime, true);
            if (data.state === 'playing' && window.player.getPlayerState() !== YT.PlayerState.PLAYING) window.player.playVideo();
            else if (data.state === 'paused' && window.player.getPlayerState() !== YT.PlayerState.PAUSED) window.player.pauseVideo();
        }
        setTimeout(() => { isUpdatingFromFirebase = false; }, 500);
    });

    const container = document.getElementById('messages');
    const popup = document.getElementById('global-reaction-popup');

    window.openReactionMenu = (e, msgId) => {
        e.stopPropagation(); activeMessageId = msgId;
        const rect = e.currentTarget.getBoundingClientRect();
        const containerRect = document.getElementById('chat-container').getBoundingClientRect();
        popup.style.top = `${rect.top - containerRect.top - 60}px`; 
        popup.style.left = `${Math.max(10, rect.left - containerRect.left - 50)}px`; 
        popup.style.display = 'flex';
    };
    document.addEventListener('click', () => { popup.style.display = 'none'; });

    // スタンプの追加・取り消し処理
    document.querySelectorAll('.reaction-emoji-btn').forEach(btn => {
        btn.onclick = async (e) => {
            e.stopPropagation(); if (!activeMessageId) return;
            const emoji = btn.dataset.emoji, msgRef = doc(db, "chat_messages", activeMessageId);
            popup.style.display = 'none';
            try {
                const snap = await getDocs(query(collection(db, "chat_messages")));
                let reactions = {};
                snap.forEach(d => { if(d.id === activeMessageId) reactions = d.data().reactions || {}; });
                
                if (!reactions[emoji]) reactions[emoji] = [];
                const idx = reactions[emoji].indexOf(myId);
                if (idx > -1) {
                    // すでに押していたら取り消し
                    reactions[emoji].splice(idx, 1);
                    if (reactions[emoji].length === 0) delete reactions[emoji];
                } else {
                    // 押していなかったら追加
                    reactions[emoji].push(myId);
                }
                await updateDoc(msgRef, { reactions });
            } catch(err) {}
        };
    });

    // 全削除確認ダイアログ
    document.getElementById('clear-all-btn').onclick = async () => {
        if (confirm("本当に削除するの？🥺")) {
            const snap = await getDocs(query(collection(db, "chat_messages")));
            for (const d of snap.docs) await deleteDoc(doc(db, "chat_messages", d.id));
        }
    };

    // リアルタイム描画（別タブやバックグラウンド復帰時にも常に最新を維持）
    onSnapshot(query(collection(db, "chat_messages"), orderBy("createdAt", "asc")), (snap) => {
        container.innerHTML = '';
        snap.forEach(d => {
            const data = d.data(), msgId = d.id, reactions = data.reactions || {};
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${data.senderId === myId ? 'my-messages' : 'other-messages'}`;
            const row = document.createElement('div'); row.className = 'message-row';
            const msg = document.createElement('div'); msg.className = 'message';
            
            if (data.image) {
                const img = document.createElement('img'); 
                img.src = data.image; 
                img.onclick = (e) => { e.stopPropagation(); document.getElementById('modal-img').src = data.image; document.getElementById('image-modal').style.display = 'flex'; };
                msg.appendChild(img);
            } else {
                msg.textContent = data.text;
            }
            msg.onclick = (e) => window.openReactionMenu(e, msgId);
            
            let badgeText = "";
            for (const [e, u] of Object.entries(reactions)) if (u.length > 0) badgeText += `${e}${u.length} `;
            if (badgeText) { const b = document.createElement('div'); b.className = 'reaction-badge-container'; b.textContent = badgeText; b.onclick = (e) => window.openReactionMenu(e, msgId); msg.appendChild(b); }
            
            row.appendChild(msg);
            const del = document.createElement('span'); del.className = 'msg-delete-link'; del.textContent = '削除';
            del.onclick = async (e) => { 
                e.stopPropagation(); 
                if (confirm("本当に削除するの？🥺")) {
                    await deleteDoc(doc(db, "chat_messages", msgId)); 
                }
            };
            row.appendChild(del); wrapper.appendChild(row); container.appendChild(wrapper);
        });
        container.scrollTop = container.scrollHeight;
    });

    document.getElementById('send-btn').onclick = async () => {
        const input = document.getElementById('message-input');
        if (input.value.trim()) { await addDoc(collection(db, "chat_messages"), { senderId: myId, text: input.value.trim(), createdAt: serverTimestamp(), reactions: {} }); input.value = ''; }
    };

    document.getElementById('message-input').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('send-btn').click(); };

    // 画像ファイルを確実にアップロード・保持するための圧縮・送信処理
    function processAndSendImage(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width, height = img.height;
                if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                else { if (height > MAX_WIDTH) { width *= MAX_WIDTH / height; height = MAX_WIDTH; } }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                
                await addDoc(collection(db, "chat_messages"), { 
                    senderId: myId, 
                    image: compressedDataUrl, 
                    createdAt: serverTimestamp(), 
                    reactions: {} 
                });
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('file-input').onchange = (e) => {
        processAndSendImage(e.target.files[0]);
        e.target.value = '';
    };

    document.getElementById('camera-input').onchange = (e) => {
        processAndSendImage(e.target.files[0]);
        e.target.value = '';
    };
    
    document.getElementById('media-share-btn').onclick = () => {
        const input = document.getElementById('media-url-input').value.trim();
        const cmds = {
            'hal': "https://steamcommunity.com/id/halsawa/",
            'mel': "https://steamcommunity.com/id/melmelpython/",
            'tel': "https://bizmee.net/1015-1227-2",
            'tver': "https://kirarimel-hub.github.io/test/",
            'chat': "https://kirarimel-hub.github.io/1015-1227-2/",
            '鐘': "https://note.com/mute_1015_1227",
            'ぶぶ': "https://note.com/mild_fox1814",
            'チャット': "https://kirarimel-hub.github.io/test/"
        };
        if (cmds[input.toLowerCase()]) { window.open(cmds[input.toLowerCase()], "_blank"); document.getElementById('media-url-input').value = ''; return; }
        
        const match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|live\/|v\/))([^#\&\?]+)/);
        if (match && match[1].length >= 11) { 
            const videoId = match[1].substring(0, 11);
            window.currentVideoId = videoId; 
            window.player.loadVideoById(videoId); 
            syncToFirebase('playing', 0); 
        }
        document.getElementById('media-url-input').value = '';
    };
</script>
</body>
</html>
