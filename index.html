<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOWYA（ロウヤ）</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; -webkit-tap-highlight-color: transparent; }
        #chat-container { width: 100%; max-width: 600px; height: 95vh; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #header { background: #007bff; color: white; padding: 10px 12px; display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0; }

        /* チャットエリア */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background: #fff; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; position: relative; margin-bottom: 5px; }
        .my-messages { align-self: flex-end; align-items: flex-end; }
        .other-messages { align-self: flex-start; align-items: flex-start; }
        .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
        .my-messages .message-row { flex-direction: row-reverse; }

        .message { padding: 10px 14px; border-radius: 18px; background: #e4e6eb; font-size: 0.9rem; word-break: break-all; white-space: pre-wrap; cursor: pointer; transition: transform 0.1s; position: relative; user-select: none; }
        .my-messages .message { background: #007bff; color: white; }
        
        /* リアクション */
        .reaction-badge-container { display: flex; gap: 3px; position: absolute; bottom: -12px; background: white; padding: 2px 6px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); border: 1px solid #eee; font-size: 0.75rem; cursor: pointer; z-index: 2; pointer-events: auto; color: #333; }
        .my-messages .reaction-badge-container { right: 10px; }
        .other-messages .reaction-badge-container { left: 10px; }

        /* スタンプポップアップ */
        .reaction-popup { display: none; position: absolute; background: white; border-radius: 30px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); gap: 8px; z-index: 999; border: 1px solid #ddd; flex-wrap: wrap; width: 220px; justify-content: center; }
        .reaction-emoji-btn { font-size: 1.3rem; border: none; background: none; cursor: pointer; padding: 4px; transition: transform 0.1s; }
        .reaction-emoji-btn:hover { transform: scale(1.25); }

        /* 削除リンク */
        .msg-delete-link { font-size: 0.7rem; color: #aaa; text-decoration: none; cursor: pointer; visibility: hidden; margin: 0 4px; padding-bottom: 2px; }
        .message-wrapper:hover .msg-delete-link { visibility: visible; }
        
        #input-container { display: flex; padding: 10px; border-top: 1px solid #ddd; gap: 8px; background: white; flex-shrink: 0; align-items: center; }
        #message-input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 0.95rem; }
        #send-btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <button id="clear-all-btn" style="background:#dc3545; color:white; border:none; border-radius:4px; padding: 5px 10px; cursor:pointer; font-size:0.85rem;">全削除</button>
    </div>

    <div id="messages"></div>

    <div id="global-reaction-popup" class="reaction-popup">
        <button class="reaction-emoji-btn" data-emoji="👍">👍</button>
        <button class="reaction-emoji-btn" data-emoji="❤️">❤️</button>
        <button class="reaction-emoji-btn" data-emoji="😂">😂</button>
        <button class="reaction-emoji-btn" data-emoji="😮">😮</button>
        <button class="reaction-emoji-btn" data-emoji="👉">👉</button>
        <button class="reaction-emoji-btn" data-emoji="🙏">🙏</button>
        <button class="reaction-emoji-btn" data-emoji="🥺">🥺</button>
        <button class="reaction-emoji-btn" data-emoji="🌿">🌿</button>
    </div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="メッセージを入力...">
        <button id="send-btn">送信</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, deleteDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNl085XeZfHiuerUWkUEXT5-gTrc96KwE",
        authDomain: "test-31742.firebaseapp.com",
        projectId: "test-31742",
        storageBucket: "test-31742.firebasestorage.app",
        messagingSenderId: "828848066600",
        appId: "1:828848066600:web:8d0e1ae6fc77c8a90e651d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const myId = Math.random().toString(36).substring(2, 9);
    let activeMessageId = null;

    const container = document.getElementById('messages');
    const popup = document.getElementById('global-reaction-popup');

    window.openReactionMenu = (e, msgId) => {
        e.stopPropagation(); activeMessageId = msgId;
        const rect = e.currentTarget.getBoundingClientRect();
        popup.style.top = `${rect.top - 60}px`; popup.style.left = `${rect.left}px`; popup.style.display = 'flex';
    };
    document.addEventListener('click', () => { popup.style.display = 'none'; });

    document.querySelectorAll('.reaction-emoji-btn').forEach(btn => {
        btn.onclick = async (e) => {
            e.stopPropagation(); if (!activeMessageId) return;
            const emoji = btn.dataset.emoji, msgRef = doc(db, "chat_messages", activeMessageId);
            const snap = await getDocs(query(collection(db, "chat_messages")));
            let reactions = {};
            snap.forEach(d => { if(d.id === activeMessageId) reactions = d.data().reactions || {}; });
            if (!reactions[emoji]) reactions[emoji] = [];
            reactions[emoji].push(myId);
            await updateDoc(msgRef, { reactions });
            popup.style.display = 'none';
        };
    });

    document.getElementById('clear-all-btn').onclick = async () => {
        if (confirm("全削除しますか？")) {
            const snap = await getDocs(query(collection(db, "chat_messages")));
            for (const d of snap.docs) await deleteDoc(doc(db, "chat_messages", d.id));
        }
    };

    onSnapshot(query(collection(db, "chat_messages"), orderBy("createdAt", "asc")), (snap) => {
        container.innerHTML = '';
        snap.forEach(d => {
            const data = d.data(), msgId = d.id, reactions = data.reactions || {};
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${data.senderId === myId ? 'my-messages' : 'other-messages'}`;
            const row = document.createElement('div'); row.className = 'message-row';
            const msg = document.createElement('div'); msg.className = 'message';
            msg.textContent = data.text;
            msg.onclick = (e) => window.openReactionMenu(e, msgId);
            
            let badgeText = "";
            for (const [e, u] of Object.entries(reactions)) if (u.length > 0) badgeText += `${e}${u.length} `;
            if (badgeText) { const b = document.createElement('div'); b.className = 'reaction-badge-container'; b.textContent = badgeText; msg.appendChild(b); }
            
            row.appendChild(msg);
            const del = document.createElement('span'); del.className = 'msg-delete-link'; del.textContent = '削除';
            del.onclick = async (e) => { e.stopPropagation(); await deleteDoc(doc(db, "chat_messages", msgId)); };
            row.appendChild(del); wrapper.appendChild(row); container.appendChild(wrapper);
        });
        container.scrollTop = container.scrollHeight;
    });

    const sendMessage = async () => {
        const input = document.getElementById('message-input');
        const text = input.value.trim().toLowerCase();
        
        // 隠しコマンド判定
        if (text === 'hal') { window.open("https://steamcommunity.com/id/halsawa/", "_blank"); input.value = ''; return; }
        if (text === 'mel') { window.open("https://steamcommunity.com/id/melmelpython/", "_blank"); input.value = ''; return; }
        if (text === 'tel') { window.open("https://bizmee.net/1015-1227-2", "_blank"); input.value = ''; return; }
        if (text === 'yt' || text === 'youtube') { window.open("https://kirarimel-hub.github.io/1015-1227-2/", "_blank"); input.value = ''; return; }

        if (input.value.trim()) {
            await addDoc(collection(db, "chat_messages"), { senderId: myId, text: input.value.trim(), createdAt: serverTimestamp(), reactions: {} });
            input.value = '';
        }
    };

    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('message-input').onkeypress = (e) => {
        if (e.key === 'Enter') sendMessage();
    };
</script>
</body>
</html>
